<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>ФАКТОР — MAX</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--card:#15181d;--card2:#1b1f25;--text:#f5f6f7;--muted:#8f98a5;--line:#292e36;--accent:#d9a84e}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{min-height:100vh}.wrap{max-width:720px;margin:0 auto;padding:24px 16px 34px}
    .brand{display:flex;align-items:center;gap:14px;margin:4px 4px 26px}.logo{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1px solid #3a3f47;background:radial-gradient(circle at 50% 35%,#303640,#090b0e 70%);font-weight:800;letter-spacing:.8px;font-size:12px}
    .title{font-size:27px;font-weight:800;letter-spacing:.4px}.sub{font-size:13px;color:var(--muted);margin-top:3px}
    .hero{background:linear-gradient(145deg,#171b21,#101318);border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px}
    .hero h1{font-size:23px;margin:0 0 8px}.hero p{color:#aab1bb;line-height:1.45;margin:0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;min-height:116px;text-align:left;color:var(--text);cursor:pointer}
    .card:active{transform:scale(.985)}.ico{font-size:25px;margin-bottom:12px}.ct{font-size:16px;font-weight:700}.cm{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}
    .wide{grid-column:1/-1;background:linear-gradient(135deg,#20252c,#171a20);border-color:#363c45}.accent{color:var(--accent)}
    .footer{color:#69717d;font-size:11px;text-align:center;margin-top:24px;line-height:1.5}
    .toast{position:fixed;left:16px;right:16px;bottom:18px;background:#252a31;border:1px solid #3a414b;border-radius:14px;padding:13px 15px;font-size:13px;display:none}
    @media(max-width:420px){.wrap{padding:18px 12px 28px}.grid{gap:9px}.card{padding:15px;min-height:108px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <div class="logo">ФАКТОР</div>
      <div><div class="title">ФАКТОР</div><div class="sub">Новости России и мира</div></div>
    </header>

    <section class="hero">
      <h1>ФАКТОР в MAX</h1>
      <p>Новости, видео и обратная связь — без лишних переходов.</p>
    </section>

    <section class="grid">
      <button class="card wide" data-start="video">
        <div class="ico">🎥</div>
        <div class="ct">Предложить видео <span class="accent">→</span></div>
        <div class="cm">Отправить редакции видео или ссылку на материал.</div>
      </button>

      <button class="card" data-start="news">
        <div class="ico">📰</div>
        <div class="ct">Новости</div>
        <div class="cm">Открыть взаимодействие с ботом.</div>
      </button>

      <button class="card" data-start="videos">
        <div class="ico">▶️</div>
        <div class="ct">Видео</div>
        <div class="cm">Получать важные видеоматериалы.</div>
      </button>

      <button class="card" data-start="urgent">
        <div class="ico">🔥</div>
        <div class="ct">Срочное</div>
        <div class="cm">Настроить получение срочных новостей.</div>
      </button>

      <button class="card" data-start="settings">
        <div class="ico">⚙️</div>
        <div class="ct">Уведомления</div>
        <div class="cm">Настроить частоту и тип уведомлений.</div>
      </button>

      <button class="card wide" data-start="chat">
        <div class="ico">💬</div>
        <div class="ct">Написать ФАКТОРУ</div>
        <div class="cm">Связаться с ботом напрямую.</div>
      </button>
    </section>

    <div class="footer">ФАКТОР • прямой новостной поток</div>
  </main>
  <div id="toast" class="toast"></div>

  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script>
    const BOT = "se14320460_1_bot";
    const toast = document.getElementById("toast");

    function notify(text){
      toast.textContent = text;
      toast.style.display = "block";
      setTimeout(()=>toast.style.display="none",2200);
    }

    function openBot(payload){
      const url = "https://max.ru/" + BOT + "?start=" + encodeURIComponent(payload);
      if (window.WebApp && typeof window.WebApp.openMaxLink === "function") {
        window.WebApp.openMaxLink(url);
      } else {
        window.location.href = url;
      }
    }

    document.querySelectorAll("[data-start]").forEach(btn=>{
      btn.addEventListener("click",()=>openBot(btn.dataset.start));
    });
  </script>
</body>
</html>
