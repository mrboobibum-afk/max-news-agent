name: Deploy FACTOR MAX Bot Backend

on:
  push:
    branches: ["main"]
    paths:
      - "max-bot-worker/**"
      - ".github/workflows/max-bot-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: max-bot-worker
          command: deploy
