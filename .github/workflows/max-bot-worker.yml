name: Deploy FACTOR MAX Bot Backend

on:
  push:
    branches: ["main"]
    paths:
      - "max-bot-worker/**"
      - ".github/workflows/max-bot-worker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: max-bot-worker
          command: deploy

      - name: Register MAX Webhook
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          curl --insecure --fail-with-body -sS -X POST "https://platform-api2.max.ru/subscriptions" \
            -H "Authorization: ${MAX_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "url": "https://factor-max-bot.mr-boobi-bum.workers.dev/webhook",
              "update_types": ["message_created", "bot_started"],
              "secret": "'"${WEBHOOK_SECRET}"'"
            }'
          echo

      - name: Verify MAX bot token
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --insecure --fail-with-body -sS "https://platform-api2.max.ru/me" \
            -H "Authorization: ${MAX_BOT_TOKEN}" \
            -H "Content-Type: application/json" |
            jq '{user_id, username, name, is_bot}' > /tmp/max-token-check.json
          cat /tmp/max-token-check.json
          content_b64="$(base64 -w0 /tmp/max-token-check.json)"
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/contents/.github/max-token-check.json" \
            -f message="Record safe MAX bot identity check" \
            -f content="${content_b64}" \
            -f branch="main"
