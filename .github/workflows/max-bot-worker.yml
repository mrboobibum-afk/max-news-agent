name: Deploy FACTOR MAX Bot Backend

on:
  push:
    branches: ["main"]
    paths:
      - "max-bot-worker/**"
      - ".github/workflows/max-bot-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync MAX bot token to Worker
        working-directory: max-bot-worker
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "${MAX_BOT_TOKEN}" | npx wrangler secret put BOT_TOKEN

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: max-bot-worker
          command: deploy

      - name: Register MAX Webhook
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          curl --insecure --fail-with-body -sS -X POST "https://platform-api2.max.ru/subscriptions" \
            -H "Authorization: ${MAX_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "url": "https://factor-max-bot.mr-boobi-bum.workers.dev/webhook",
              "update_types": ["message_created", "bot_started"],
              "secret": "'"${WEBHOOK_SECRET}"'"
            }'
          echo
