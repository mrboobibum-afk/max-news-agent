name: FAKTOR Auto

on:
  schedule:
    # Запуск новой смены каждый час
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faktor-pipeline-v2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yt-dlp & ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run FAKTOR 50-Min Loop
        timeout-minutes: 55
        env:
          GITHUB_ACTIONS: "true"
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.ANYMODEL_API_KEY }}
          QWEN_BASE_URL: "https://anymodel.org/v1"
          QWEN_MODEL: "am/gpt-oss-20b"
          MAX_VIDEO_MB: "30"
          MAX_IMAGE_MB: "15"

        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 10 итераций по 5 минут = ~50 минут непрерывного эфира
          for i in {1..10}; do
            echo "=== Итерация $i из 10: $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

            deno run \
              --v8-flags=--max-old-space-size=6144 \
              --allow-net \
              --allow-env \
              --allow-read \
              --allow-write \
              --allow-run \
              agent.ts || true

            if [ -f .factor-state.json ]; then
              git add .factor-state.json
              if ! git diff --staged --quiet; then
                git commit -m "chore: sync state [skip ci]" || true
                git pull origin main --rebase -X theirs || true
                git push origin HEAD:main || true
              fi
            fi

            if [ $i -lt 10 ]; then
              echo "Пауза 300 секунд..."
              sleep 300
            fi
          done

      - name: Finish
        if: ${{ always() }}
        run: echo "Часовая смена вещания завершена."
        
