name: FAKTOR Auto

on:
  push:
    paths:
      - ".github/workflows/faktor-auto.yml"
  schedule:
    - cron: "2-59/5 * * * *"
      timezone: "UTC"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faktor-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run FAKTOR
        env:
          GITHUB_ACTIONS: "true"
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MAX_VIDEO_MB: "60"
          MAX_IMAGE_MB: "15"
        run: |
          deno run \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            agent.ts

      - name: Save FAKTOR state
        if: always()
        run: |
          if git diff --quiet -- .factor-state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The source branch may receive a code commit while this run is
          # processing news. Rebase the state change onto the latest main
          # before pushing so a non-fast-forward push cannot discard the
          # publication history.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            git add .factor-state.json

            if git diff --cached --quiet -- .factor-state.json; then
              echo "State already persisted by another run."
              exit 0
            fi

            git commit -m "chore: update faktor state"

            if git push origin HEAD:main; then
              echo "FAKTOR state saved."
              exit 0
            fi

            echo "State push failed on attempt $attempt; retrying."
            git rebase --abort || true
            git reset --soft HEAD~1
          done

          echo "Failed to persist FAKTOR state after 3 attempts."
          exit 1
