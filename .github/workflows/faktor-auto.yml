name: FAKTOR Auto

on:
  schedule:
    - cron: '*/15 * * * *' # Запуск каждые 15 минут
  workflow_dispatch:

concurrency:
  group: faktor-auto
  cancel-in-progress: true # Отменяет старые запуски, если начался новый

jobs:
  run-faktor:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Максимум 10 минут на работу

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run FAKTOR once
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: deno run -A --unsafely-ignore-certificate-errors=platform-api2.max.ru agent.ts

      - name: Commit state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .factor-state.json
          git commit -m "Update state [skip ci]" || echo "No changes to commit"
          git push
