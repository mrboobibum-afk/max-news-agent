name: FAKTOR Auto

on:
  schedule:
    - cron: '0 */5 * * *' # Запуск каждые 5 часов
  workflow_dispatch:

concurrency:
  group: faktor-auto
  cancel-in-progress: true # 🚀 ГЛАВНОЕ ИСПРАВЛЕНИЕ: Убиваем старые процессы и очищаем очередь!

jobs:
  run-faktor:
    runs-on: ubuntu-latest
    timeout-minutes: 290 # 4 часа 50 минут

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run FAKTOR (Long Loop)
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: deno run -A --unsafely-ignore-certificate-errors=platform-api2.max.ru agent.ts

      - name: Commit final state
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || echo "Pull failed"
          git add .factor-state.json || echo "No state file"
          git commit -m "Update state [skip ci]" || echo "No changes"
          git push || echo "Push failed"
