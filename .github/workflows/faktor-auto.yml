name: FAKTOR Auto

on:
  push:
    branches:
      - main
  schedule:
    # Запуск планировщика раз в 30 минут как подстраховка
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faktor-pipeline-v2
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install yt-dlp & ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run FAKTOR Loop
        timeout-minutes: 30
        env:
          GITHUB_ACTIONS: "true"
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.ANYMODEL_API_KEY }}
          QWEN_BASE_URL: "https://anymodel.org/v1"
          QWEN_MODEL: "am/gpt-oss-20b"
          MAX_VIDEO_MB: "30"
          MAX_IMAGE_MB: "15"

        run: |
          set -u
          # Выполняем 5 итераций с паузой в 5 минут (суммарно ~25 минут работы)
          for i in {1..5}; do
            echo "=== Итерация $i из 5: $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

            deno run \
              --v8-flags=--max-old-space-size=6144 \
              --allow-net \
              --allow-env \
              --allow-read \
              --allow-write \
              --allow-run \
              agent.ts || true

            # Сохранение состояния после каждой итерации
            if ! git diff --quiet -- .factor-state.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .factor-state.json
              git commit -m "chore: update faktor state [skip ci]" || true
              git fetch origin main || true
              git rebase origin/main || true
              git push origin HEAD:main || true
            fi

            if [ $i -lt 5 ]; then
              echo "Пауза 300 секунд до следующей проверки..."
              sleep 300
            fi
          done

      - name: Finish Run
        if: ${{ always() }}
        run: echo "Сессия вещания успешно завершена."
        
