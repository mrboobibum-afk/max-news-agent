name: FAKTOR Auto

# FAKTOR runner: keep scheduled five-minute polling and manual dispatch available.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faktor-pipeline-v2
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run FAKTOR
        timeout-minutes: 4
        env:
          GITHUB_ACTIONS: "true"
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MAX_VIDEO_MB: "30"
          MAX_IMAGE_MB: "15"
        run: |
          set -u
          echo "FAKTOR: single cycle started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          deno run             --v8-flags=--max-old-space-size=6144             --allow-net             --allow-env             --allow-read             --allow-write             --allow-run             agent.ts
          echo "FAKTOR: single cycle finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Save FAKTOR state
        if: ${{ always() }}
        run: |
          if git diff --quiet -- .factor-state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .factor-state.json
          git commit -m "chore: update faktor state [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "FAKTOR state saved."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "State push failed on attempt $attempt; retrying."
          done

          echo "Failed to persist FAKTOR state after 3 attempts."
          exit 1
